spring:
  application:
    name: digital-dad
  # 服务器部署时建议设置 profiles.active=prod，以便按 info/warn/error 分文件写日志（见 logback-spring.xml）

  datasource:
    url: jdbc:mysql://101.34.64.224:3306/digital_dad?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: digital_dad
    password: digital_dad
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false   # 不在控制台输出 SQL，避免刷屏
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

# JWT 配置
jwt:
  secret: digital-dad-jwt-secret-key-at-least-256-bits-for-hs256
  expiration-seconds: 604800  # 7天 (86400 * 7)
  header: Authorization
  prefix: "Bearer "

# 短信验证码配置
sms:
  code-expire-seconds: 300   # 5分钟
  send-interval-seconds: 60  # 60秒内不可重复获取
  # 腾讯云短信（配置 SecretId/SecretKey 后真实发送，未配置则仅打印日志。通过环境变量配置，勿提交敏感信息）
  tencent:
    # 通过环境变量配置，勿提交真实密钥
    secret-id: ${TENCENT_SMS_SECRET_ID:}
    secret-key: ${TENCENT_SMS_SECRET_KEY:}
    sdk-app-id: ${TENCENT_SMS_SDK_APP_ID:}
    sign-name: ${TENCENT_SMS_SIGN_NAME:}
    template-id: ${TENCENT_SMS_TEMPLATE_ID:}
    # 模板参数个数：1=仅验证码，2=验证码+有效期(分钟)，需与腾讯云模板占位符一致
    template-param-count: ${TENCENT_SMS_TEMPLATE_PARAM_COUNT:2}
    region: ${TENCENT_SMS_REGION:ap-guangzhou}

# 应用配置
app:
  base-url: http://localhost:8080  # C端分享链接、二维码 base，生产环境需改为实际域名
  # 微信小程序（用于 C 端扫码登录：小程序将 code 发到后端，后端 code2session 换 openid 并签发 JWT）
  wechat:
    miniprogram:
      # 通过环境变量配置，勿提交真实密钥
      app-id: ${WECHAT_MINI_APP_ID:}
      app-secret: ${WECHAT_MINI_APP_SECRET:}
  ai:
    enabled: ${APP_AI_ENABLED:true}  # 是否启用真实 AI，默认 true
  # DeepSeek 大模型（通过环境变量覆盖，勿提交敏感信息）
  deepseek:
    # 通过环境变量配置，勿提交真实密钥
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
  # 火山引擎语音识别（通过环境变量覆盖）
  volcengine:
    app-id: ${VOLCENGINE_APP_ID:7567124792}
    access-token: ${VOLCENGINE_ACCESS_TOKEN:E1htMsq5k0vwNgxK59R6fFCumLF7vDp5}
    resource-id: volc.seedasr.sauc.duration  # 豆包流式语音识别模型2.0-小时版
    ws-url: wss://openspeech.bytedance.com/api/v3/sauc/bigmodel_async

server:
  port: 8080
